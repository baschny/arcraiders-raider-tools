version: 1
env:
  variables:
    VITE_SCHEDULE_DATA_URL: https://api.raider-tools.app/schedule/map-events.json
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Vite default output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.raider-tools.app;"
  # Map tile folders are named by a content hash of their texture (scripts/lib/map-tiles.mjs): never revalidate.
  - pattern: 'data/map-data/tiles/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
