version: 1
env:
  variables:
    VITE_SCHEDULE_DATA_URL: https://api.raider-tools.app/schedule/map-events.json
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Vite default output directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
